name: Feature request
description: Propose a bounded capability or improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem should CoFi solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the smallest useful behavior.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Financial and security invariants
      description: Identify replay, scope, currency, ledger, authorization, or audit constraints that matter.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
