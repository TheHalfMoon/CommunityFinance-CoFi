name: CoFi Desktop Release

on:
  push:
    tags:
      - "v*"
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cofi-desktop-release
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and publish Windows desktop
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'issue_comment' &&
        github.actor == 'TheHalfMoon' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/release-desktop ')
      )
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Resolve release target
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
          RELEASE_COMMAND: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $createTag = $false

          if ($env:EVENT_NAME -eq "push") {
            $tag = $env:PUSH_TAG
            $target = $env:PUSH_SHA
          } else {
            $parts = ($env:RELEASE_COMMAND ?? "").Trim() -split "\s+"
            if ($parts.Count -ne 3 -or $parts[0] -ne "/release-desktop") {
              throw "Expected: /release-desktop <vMAJOR.MINOR.PATCH> <40-char-merge-sha>"
            }

            $tag = $parts[1]
            $target = $parts[2].ToLowerInvariant()

            if ($tag -notmatch "^v[0-9]+\.[0-9]+\.[0-9]+$") {
              throw "Release tag must be strict semver, for example v1.1.1."
            }
            if ($target -notmatch "^[0-9a-f]{40}$") {
              throw "Release target must be a full 40-character commit SHA."
            }

            $pr = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER" | ConvertFrom-Json
            if (-not $pr.merged_at) {
              throw "Release command must be issued on a merged pull request."
            }
            if ($pr.base.ref -ne "main") {
              throw "Release command must target a pull request merged into main."
            }
            if ($pr.merge_commit_sha -ne $target) {
              throw "Requested target $target does not match PR merge commit $($pr.merge_commit_sha)."
            }

            $commit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$target" | ConvertFrom-Json
            if ($commit.parents.Count -ne 2) {
              throw "Release target must be a normal merge commit with exactly two parents."
            }

            gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" *> $null
            if ($LASTEXITCODE -eq 0) {
              $createTag = $false
            } else {
              $createTag = $true
            }
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TARGET_SHA=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CREATE_TAG=$($createTag.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RELEASE_TAG=$tag"
          Write-Host "TARGET_SHA=$target"
          Write-Host "CREATE_TAG=$($createTag.ToString().ToLowerInvariant())"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact release target
        shell: pwsh
        run: |
          git fetch --no-tags origin $env:TARGET_SHA
          git checkout --detach $env:TARGET_SHA
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SHA) {
            throw "Checked out $actual instead of requested release target $env:TARGET_SHA."
          }

      - name: Validate existing release tag
        if: env.CREATE_TAG == 'false'
        shell: pwsh
        run: |
          git fetch origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG" --force
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch existing release tag $env:RELEASE_TAG."
          }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($tagCommit -ne $env:TARGET_SHA) {
            throw "Release tag $env:RELEASE_TAG resolves to $tagCommit, expected $env:TARGET_SHA."
          }

      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $package = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $expected = "v$($package.version)"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag $env:RELEASE_TAG does not match desktop version $expected."
          }

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Audit desktop dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=high

      - name: Test desktop IPC contract
        working-directory: apps/desktop
        run: npm run test:ipc

      - name: Qualify native host
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build Windows installers
        working-directory: apps/desktop
        run: npm run desktop:build

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          )
          if ($files.Count -ne 2) {
            throw "Expected one MSI and one NSIS installer."
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Create annotated release tag
        if: github.event_name == 'issue_comment' && env.CREATE_TAG == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:RELEASE_TAG $env:TARGET_SHA -m "CoFi $env:RELEASE_TAG"
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release tag $env:RELEASE_TAG."
          }

      - name: Verify release tag target
        shell: pwsh
        run: |
          git fetch origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG" --force
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch release tag $env:RELEASE_TAG."
          }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($tagCommit -ne $env:TARGET_SHA) {
            throw "Release tag $env:RELEASE_TAG resolves to $tagCommit, expected $env:TARGET_SHA."
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $msi = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi).FullName
          $nsis = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          $checksums = (Resolve-Path apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt).Path
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $msi $nsis $checksums --clobber
          } else {
            gh release create $tag $msi $nsis $checksums --verify-tag --generate-notes --title "CoFi $tag"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed for $tag."
          }
