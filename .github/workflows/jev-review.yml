name: CoFi Secure Jev Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cofi-jev-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  jev-review:
    name: Jev Exact-Diff Semantic Review
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/jev-review'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      JEV_REVIEW_SHA: 31f89602797fb7bea007f8a480bf368bf564954e
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set exact base and head
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          HEAD_SHA="$(git rev-parse FETCH_HEAD)"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          if [ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" != "$BASE_SHA" ]; then
            echo "::error::PR head is not descended from canonical main; sync main into the feature branch before Jev qualification."
            exit 1
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "JEV_EXACT_RANGE=${BASE_SHA}..${HEAD_SHA}"

      - name: Require existing TypeSafe credential
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TYPESAFE_API_KEY:-}" ]; then
            echo "::error::TYPESAFE_API_KEY is not configured for CoFi GitHub Actions; Jev qualification remains UNPROVEN."
            exit 1
          fi

      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install pinned Jev Review runtime
        shell: bash
        run: |
          set -euo pipefail
          JEV_DIR="$RUNNER_TEMP/jev-review"
          git clone https://github.com/devagrawal09/jev-review.git "$JEV_DIR"
          git -C "$JEV_DIR" checkout --detach "$JEV_REVIEW_SHA"
          test "$(git -C "$JEV_DIR" rev-parse HEAD)" = "$JEV_REVIEW_SHA"
          npm --prefix "$JEV_DIR" ci

      - name: Verify base-controlled adapter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git cat-file -e "$BASE_SHA:.github/scripts/jev-exact-diff.mjs"
          BASE_ADAPTER="$RUNNER_TEMP/cofi-jev-exact-diff.mjs"
          git show "$BASE_SHA:.github/scripts/jev-exact-diff.mjs" > "$BASE_ADAPTER"
          node --check "$BASE_ADAPTER"

      - name: Run genuine Jev exact-diff review
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          JEV_DIR="$RUNNER_TEMP/jev-review"
          BASE_ADAPTER="$RUNNER_TEMP/cofi-jev-exact-diff.mjs"
          REPORT="$RUNNER_TEMP/jev-review.json"
          node "$BASE_ADAPTER" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE" "$JEV_DIR" | tee "$REPORT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jev-review.json").read_text())
          if report.get("base_sha") != os.environ["BASE_SHA"]:
              raise SystemExit("Jev report base SHA mismatch")
          if report.get("head_sha") != os.environ["HEAD_SHA"]:
              raise SystemExit("Jev report head SHA mismatch")
          if report.get("status") != "PASSED":
              raise SystemExit("Jev report did not pass")
          coverage = report.get("coverage", {})
          if not coverage.get("complete"):
              raise SystemExit("Jev exact-diff coverage is incomplete")
          if coverage.get("expected_hunks") != coverage.get("reviewed_hunks"):
              raise SystemExit("Jev hunk count mismatch")
          if report.get("blocking_findings"):
              raise SystemExit("Jev reported blocking findings")
          print(
              "JEV_STATUS=PASSED "
              f"JEV_COVERAGE={coverage['reviewed_hunks']}/{coverage['expected_hunks']} "
              "JEV_BLOCKING_FINDINGS=0"
          )
          PY

      - name: Upload Jev evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cofi-jev-review-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/jev-review.json
          if-no-files-found: warn
          retention-days: 14
