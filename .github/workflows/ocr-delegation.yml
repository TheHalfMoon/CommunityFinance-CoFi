name: Alibaba OCR Delegation Gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  delegation:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/ocr-delegate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Fetch canonical base
        run: git fetch origin main:refs/remotes/origin/main

      - name: Install pinned Alibaba Open Code Review
        run: |
          npm install -g @alibaba-group/open-code-review@1.12.9
          ocr version

      - name: Resolve review scope
        run: |
          set -euo pipefail
          ocr delegate preview --from origin/main --to HEAD | tee ocr-preview.txt

      - name: Resolve review rules
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files to review."
            exit 0
          fi
          ocr delegate rule "${files[@]}" | tee ocr-rules.txt

      - name: Record exact review range
        run: |
          echo "OCR_VERSION=$(ocr version)"
          echo "BASE_SHA=$(git rev-parse origin/main)"
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          echo "CHANGED_FILES=$(git diff --name-only origin/main...HEAD | wc -l)"
