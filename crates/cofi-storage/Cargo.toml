[package]
name = "cofi-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned, validated persistence records for CoFi canonical domains"

[dependencies]
cofi-ledger = { path = "../cofi-ledger" }
cofi-community = { path = "../cofi-community" }
cofi-governance = { path = "../cofi-governance" }
cofi-spending = { path = "../cofi-spending" }
cofi-disbursements = { path = "../cofi-disbursements" }
cofi-metering = { path = "../cofi-metering" }
cofi-billing = { path = "../cofi-billing" }
cofi-rating = { path = "../cofi-rating" }
cofi-subscriptions = { path = "../cofi-subscriptions" }
cofi-invoicing = { path = "../cofi-invoicing" }
cofi-audit = { path = "../cofi-audit" }
cofi-reconciliation = { path = "../cofi-reconciliation" }
cofi-rating-authorization = { path = "../cofi-rating-authorization" }
cofi-invoice-authorization = { path = "../cofi-invoice-authorization" }
cofi-finalization-authorization = { path = "../cofi-finalization-authorization" }
cofi-payment-authorization = { path = "../cofi-payment-authorization" }
cofi-payout-authorization = { path = "../cofi-payout-authorization" }
cofi-fund-allocation-authorization = { path = "../cofi-fund-allocation-authorization" }
cofi-fund-transfer-authorization = { path = "../cofi-fund-transfer-authorization" }
cofi-payments = { path = "../cofi-payments" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[lints]
workspace = true
